name: Deploy Install Scripts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    # No self-hosted runners on this repo — use ubuntu-latest for test+deploy.
    # (stszone/aspos runners are repo-scoped and do not pick up these jobs.)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Contract: dashboard installInstructions (aspos PrintAgentController)
      # emits -TenantId / TENANT_ID as arg 3. Scripts that lag that contract
      # break every tenant's paste-from-UI install (Aug 2026 outage).
      - name: Guard install scripts accept TENANT_ID
        shell: bash
        run: |
          set -euo pipefail
          grep -qE '\[string\]\$TenantId' install/windows/install.ps1 \
            || { echo "ERROR: install/windows/install.ps1 missing -TenantId param"; exit 1; }
          grep -qE 'TENANT_ID=\$TenantId' install/windows/install.ps1 \
            || { echo "ERROR: install/windows/install.ps1 does not write TENANT_ID to .env"; exit 1; }
          for os in linux macos raspberry-pi; do
            grep -qF 'TENANT_ID="${3' "install/${os}/install.sh" \
              || { echo "ERROR: install/${os}/install.sh missing TENANT_ID as arg 3"; exit 1; }
            grep -qF 'TENANT_ID=${TENANT_ID}' "install/${os}/install.sh" \
              || { echo "ERROR: install/${os}/install.sh does not write TENANT_ID to .env"; exit 1; }
          done
          echo "OK: all install scripts accept and persist TENANT_ID"

      - name: Guard Windows installer asserts elevation
        shell: bash
        run: |
          set -euo pipefail
          grep -qF 'Test-IsAdministrator' install/windows/install.ps1 \
            || { echo "ERROR: install/windows/install.ps1 missing Test-IsAdministrator"; exit 1; }
          grep -qF 'Not running as Administrator' install/windows/install.ps1 \
            || { echo "ERROR: install/windows/install.ps1 missing elevation error copy"; exit 1; }
          echo "OK: Windows installer asserts elevation with actionable error"

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to AS POS APP SERVER
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AS POS APP SERVER
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        run: |
          VERSION=$(jq -r .version package.json)
          [ -n "$VERSION" ] && [ "$VERSION" != "null" ] || { echo "ERROR: could not read version from package.json"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Stage install + uninstall scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/linux dist/macos dist/raspberry-pi dist/windows
          cp install/linux/install.sh          dist/linux/install.sh
          cp install/linux/uninstall.sh        dist/linux/uninstall.sh
          cp install/macos/install.sh          dist/macos/install.sh
          cp install/macos/uninstall.sh        dist/macos/uninstall.sh
          cp install/raspberry-pi/install.sh   dist/raspberry-pi/install.sh
          cp install/raspberry-pi/uninstall.sh dist/raspberry-pi/uninstall.sh
          cp install/windows/install.ps1       dist/windows/install.ps1
          cp install/windows/uninstall.ps1     dist/windows/uninstall.ps1

      - name: Write latest.json
        shell: bash
        run: |
          set -euo pipefail
          RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="https://aspos.io/install/agent"
          # Schema is additive: existing `scripts` map is unchanged so legacy
          # consumers (InstallInstructionsService::scriptUrl) keep working.
          # `uninstall_scripts` is read by the new uninstallUrl() method.
          jq -n \
            --arg version    "$VERSION" \
            --arg released_at "$RELEASED_AT" \
            --arg base_url   "$BASE_URL" \
            '{
              version:     $version,
              released_at: $released_at,
              scripts: {
                "linux":        "\($base_url)/linux/install.sh",
                "macos":        "\($base_url)/macos/install.sh",
                "raspberry-pi": "\($base_url)/raspberry-pi/install.sh",
                "windows":      "\($base_url)/windows/install.ps1"
              },
              uninstall_scripts: {
                "linux":        "\($base_url)/linux/uninstall.sh",
                "macos":        "\($base_url)/macos/uninstall.sh",
                "raspberry-pi": "\($base_url)/raspberry-pi/uninstall.sh",
                "windows":      "\($base_url)/windows/uninstall.ps1"
              }
            }' > dist/latest.json

      # Runners live on the apps host. Prefer a local rsync into the serve
      # directory (no SSH). Fall back to the restricted deploy-key rsync for
      # any future off-box runner.
      - name: Publish to aspos-installs
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ secrets.ASPOS_APPS_PATH }}"
          if [ -z "$DEST" ]; then DEST="/var/www/aspos-installs"; fi
          if [ -d "$DEST" ] && [ -w "$DEST" ]; then
            echo "Local publish → $DEST"
            rsync -rlpt ./dist/ "$DEST/"
          else
            echo "Remote publish via SSH → ${{ secrets.ASPOS_APPS_USER }}@${{ secrets.ASPOS_APPS_HOST }}:$DEST"
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "${{ secrets.ASPOS_APPS_SSH_KEY }}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "${{ secrets.KNOWN_HOST_KEY }}" >> ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            rsync -rlptz \
              -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=yes" \
              ./dist/ \
              "${{ secrets.ASPOS_APPS_USER }}@${{ secrets.ASPOS_APPS_HOST }}:${DEST}/"
            rm -f ~/.ssh/deploy_key
          fi

      - name: Verify live install scripts serve TENANT_ID contract
        shell: bash
        run: |
          set -euo pipefail
          # Bust any intermediary cache; scripts themselves are Cache-Control: no-cache.
          PS1=$(curl -fsSL "https://aspos.io/install/agent/windows/install.ps1?t=$(date +%s)")
          echo "$PS1" | grep -qE '\[string\]\$TenantId' \
            || { echo "ERROR: live windows/install.ps1 missing -TenantId after publish"; exit 1; }
          echo "$PS1" | grep -qE 'TENANT_ID=\$TenantId' \
            || { echo "ERROR: live windows/install.ps1 missing TENANT_ID=.env write after publish"; exit 1; }
          SH=$(curl -fsSL "https://aspos.io/install/agent/linux/install.sh?t=$(date +%s)")
          echo "$SH" | grep -qF 'TENANT_ID="${3' \
            || { echo "ERROR: live linux/install.sh missing TENANT_ID as arg 3 after publish"; exit 1; }
          VER=$(curl -fsSL "https://aspos.io/install/agent/latest.json?t=$(date +%s)" | jq -r .version)
          echo "Live latest.json version=$VER"
          [ "$VER" = "$VERSION" ] || { echo "ERROR: latest.json version '$VER' != package.json '$VERSION'"; exit 1; }
          echo "OK: live install host matches $VERSION and TENANT_ID contract"
