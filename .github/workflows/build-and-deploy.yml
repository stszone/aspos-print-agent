name: Deploy Install Scripts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to AS POS APP SERVER
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AS POS APP SERVER
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read version
        run: |
          VERSION=$(jq -r .version package.json)
          [ -n "$VERSION" ] && [ "$VERSION" != "null" ] || { echo "ERROR: could not read version from package.json"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Stage install + uninstall scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/linux dist/macos dist/raspberry-pi dist/windows
          cp install/linux/install.sh          dist/linux/install.sh
          cp install/linux/uninstall.sh        dist/linux/uninstall.sh
          cp install/macos/install.sh          dist/macos/install.sh
          cp install/macos/uninstall.sh        dist/macos/uninstall.sh
          cp install/raspberry-pi/install.sh   dist/raspberry-pi/install.sh
          cp install/raspberry-pi/uninstall.sh dist/raspberry-pi/uninstall.sh
          cp install/windows/install.ps1       dist/windows/install.ps1
          cp install/windows/uninstall.ps1     dist/windows/uninstall.ps1

      - name: Write latest.json
        shell: bash
        run: |
          set -euo pipefail
          RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="https://aspos.io/install/agent"
          # Schema is additive: existing `scripts` map is unchanged so legacy
          # consumers (InstallInstructionsService::scriptUrl) keep working.
          # `uninstall_scripts` is read by the new uninstallUrl() method.
          jq -n \
            --arg version    "$VERSION" \
            --arg released_at "$RELEASED_AT" \
            --arg base_url   "$BASE_URL" \
            '{
              version:     $version,
              released_at: $released_at,
              scripts: {
                "linux":        "\($base_url)/linux/install.sh",
                "macos":        "\($base_url)/macos/install.sh",
                "raspberry-pi": "\($base_url)/raspberry-pi/install.sh",
                "windows":      "\($base_url)/windows/install.ps1"
              },
              uninstall_scripts: {
                "linux":        "\($base_url)/linux/uninstall.sh",
                "macos":        "\($base_url)/macos/uninstall.sh",
                "raspberry-pi": "\($base_url)/raspberry-pi/uninstall.sh",
                "windows":      "\($base_url)/windows/uninstall.ps1"
              }
            }' > dist/latest.json

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.ASPOS_APPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.KNOWN_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload via rsync
        run: |
          rsync -rlptz \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=yes" \
            ./dist/ \
            ${{ secrets.ASPOS_APPS_USER }}@${{ secrets.ASPOS_APPS_HOST }}:${{ secrets.ASPOS_APPS_PATH }}/

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
