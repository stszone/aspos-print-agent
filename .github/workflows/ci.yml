name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    # This repo has no self-hosted runners registered (only stszone/aspos does).
    # ubuntu-latest still runs here; keep the TENANT_ID contract guard either way.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Check for unquoted dot in node -e split (regression guard)
        run: |
          if grep -qnE 'split\(\s*\.' install/windows/install.ps1; then
            echo "ERROR: Unquoted dot in split() detected in install/windows/install.ps1"
            echo "       Use split('.') not split(.) — unquoted dot causes SyntaxError in node -e on Windows PowerShell 5.1"
            echo "       This has regressed in PR #6, #8, #9. See fix/node-version-split-dot."
            exit 1
          fi

      # Keep install script argv in lockstep with aspos PrintAgentController
      # installInstructions (TENANT_ID / -TenantId). Drift here breaks every
      # tenant's paste-from-UI install.
      - name: Guard install scripts accept TENANT_ID
        shell: bash
        run: |
          set -euo pipefail
          grep -qE '\[string\]\$TenantId' install/windows/install.ps1 \
            || { echo "ERROR: install/windows/install.ps1 missing -TenantId param"; exit 1; }
          grep -qE 'TENANT_ID=\$TenantId' install/windows/install.ps1 \
            || { echo "ERROR: install/windows/install.ps1 does not write TENANT_ID to .env"; exit 1; }
          for os in linux macos raspberry-pi; do
            grep -qF 'TENANT_ID="${3' "install/${os}/install.sh" \
              || { echo "ERROR: install/${os}/install.sh missing TENANT_ID as arg 3"; exit 1; }
            grep -qF 'TENANT_ID=${TENANT_ID}' "install/${os}/install.sh" \
              || { echo "ERROR: install/${os}/install.sh does not write TENANT_ID to .env"; exit 1; }
          done
          echo "OK: all install scripts accept and persist TENANT_ID"

      # iwr|iex ignores #Requires -RunAsAdministrator; the function must
      # assert elevation itself or users hit cryptic git Permission denied.
      - name: Guard Windows installer asserts elevation
        shell: bash
        run: |
          set -euo pipefail
          grep -qF 'Test-IsAdministrator' install/windows/install.ps1 \
            || { echo "ERROR: install/windows/install.ps1 missing Test-IsAdministrator"; exit 1; }
          grep -qF 'Not running as Administrator' install/windows/install.ps1 \
            || { echo "ERROR: install/windows/install.ps1 missing elevation error copy"; exit 1; }
          echo "OK: Windows installer asserts elevation with actionable error"
