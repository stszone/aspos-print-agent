name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Check for unquoted dot in node -e split (regression guard)
        run: |
          if grep -qn 'split(\.' install/windows/install.ps1; then
            echo "ERROR: Unquoted dot in split() detected in install/windows/install.ps1"
            echo "       Use split('.') not split(.) — unquoted dot causes SyntaxError in node -e on Windows PowerShell 5.1"
            echo "       This has regressed in PR #6, #8, #9. See fix/node-version-split-dot."
            exit 1
          fi
